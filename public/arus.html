<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arus — Keuangan Pribadi</title>
<script>
/* Terapkan tema sebelum render agar tidak kedip */
(function(){try{var s=localStorage.getItem('arus-theme');
 var dk=s?s==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
 if(dk)document.documentElement.classList.add('dark');}catch(e){}})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F4F1E8;--card:#FFFFFF;--soft:#ECE8DB;--line:#E2DCCC;--ink:#242019;--mut:#8B8471;
 --pos:#0E7B4F;--pos-soft:#DFF0E6;--neg:#C14E33;--neg-soft:#F9E8E1;--warn:#97741F;--warn-soft:#F5EDD5;
 --shadow:0 12px 32px rgba(30,27,21,.10);
 --inv:#242019;--invfg:#F4F1E8;--invmut:#9B947F;--invpos:#63D6A0;--invneg:#F09A7E}
.dark{--bg:#16140F;--card:#211E17;--soft:#2B2820;--line:#393428;--ink:#EFEBDE;--mut:#9A927C;
 --pos:#4EC38A;--pos-soft:#20342A;--neg:#E8825F;--neg-soft:#3C2820;--warn:#D8A94E;--warn-soft:#39311C;
 --shadow:0 12px 32px rgba(0,0,0,.4);
 --inv:#F1EDE1;--invfg:#1C1912;--invmut:#6F6957;--invpos:#0E7B4F;--invneg:#C14E33}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
 background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
.w10{width:10px;height:10px}.w12{width:12px;height:12px}.w14{width:14px;height:14px}.w16{width:16px;height:16px}.w20{width:20px;height:20px}
.muted{color:var(--mut)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.small{font-size:12.5px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.right{text-align:right}.grow{flex:1}.minw{min-width:0}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
 display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);
 text-decoration:none;color:inherit}
.sidebar nav{padding:10px 12px;flex:1;overflow-y:auto}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);
 text-decoration:none;font-weight:600;font-size:13.5px;transition:.15s;width:100%;font-family:inherit;cursor:pointer;border:none;background:none;text-align:left}
.navlink svg{flex-shrink:0}
.navlink:hover{color:var(--ink);background:var(--soft)}
.navlink.active{background:var(--ink);color:var(--bg)}
.bcount{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:10px;background:var(--soft);color:var(--mut);padding:1px 7px;border-radius:6px}
.navlink.active .bcount{background:rgba(255,255,255,.2);color:var(--bg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:0 20px;height:62px;border-bottom:1px solid var(--line);
 background:var(--bg);position:sticky;top:0;z-index:20}
.balpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(15,13,10,.45);z-index:55;display:none}
.scrim.show{display:block}
#view{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 20px 40px}
@media(max-width:900px){
 .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 60px rgba(0,0,0,.25)}
 .sidebar.open{transform:none}
 .menu-btn{display:inline-flex}
 .balpill{display:none}}

/* Komponen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
 background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;
 cursor:pointer;transition:.15s;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.danger:hover{background:var(--neg);opacity:.9}
.btn.mini{padding:5px 10px;font-size:11.5px;border-radius:8px;gap:5px}
.btn.icon{padding:8px}
.btn:focus-visible,.fld:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.fld{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
 padding:9px 12px;font-size:13px;outline:none;font-family:inherit;transition:.15s}
.fld:focus{border-color:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:5px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;color:var(--mut);font:inherit;font-size:12px;font-weight:600;
 padding:6px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--ink);color:var(--bg)}

/* Tabel */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);
 padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--soft)}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;background:var(--card)}

/* Badge, chip, lainnya */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.b-unpaid{background:var(--soft);color:var(--mut)}
.b-part{background:var(--warn-soft);color:var(--warn)}
.b-paid{background:var(--pos-soft);color:var(--pos)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;background:var(--soft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.cdot{width:8px;height:8px;border-radius:99px;display:inline-block;flex-shrink:0}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;margin:0 6px 6px 0}
.pop{animation:pop .2s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.tagx{background:var(--soft);border-radius:4px;padding:1px 5px;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sicon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sic-neg{background:var(--neg-soft);color:var(--neg)}
.sic-pos{background:var(--pos-soft);color:var(--pos)}
.rank{width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;font-family:ui-monospace,Consolas,monospace}
.iconbtn{border:none;background:none;color:var(--mut);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex}
.iconbtn:hover{color:var(--neg);background:var(--soft)}
.navmore{text-decoration:none;font-weight:600}
.navmore:hover{color:var(--ink)}
.mbtn{border:none;background:none;color:var(--mut);padding:8px 10px;cursor:pointer;display:flex;align-items:center}
.mbtn:hover{color:var(--ink);background:var(--soft)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;display:flex;gap:9px;font-size:13px;font-weight:600;align-items:flex-start}
.setrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.setrow:last-child{border-bottom:none}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}

/* Baris transaksi & utang */
.trow{padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.tname{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tamount{font-size:13px;font-weight:700;flex-shrink:0}
.dayhead{padding:12px 0 4px}
.dayline{flex:1;height:1px;background:var(--line)}
.drow{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:10px}
.drow:last-child{border-bottom:none}

/* Hero saldo */
.hero{background:var(--inv);color:var(--invfg);border-radius:16px;padding:24px;position:relative;overflow:hidden;
 display:flex;flex-direction:column;min-height:300px}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;
 background:repeating-linear-gradient(180deg,transparent 0 30px,rgba(128,128,128,.09) 30px 31px)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--invpos);position:relative;flex-shrink:0}
.dot::after{content:'';position:absolute;inset:-4px;border-radius:99px;border:2px solid var(--invpos);animation:ping 1.6s infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(1.4);opacity:0}}
.hbar{display:flex;align-items:center;gap:10px;font-size:12px;margin-top:9px}
.hbar span{width:78px;color:var(--invmut);flex-shrink:0}
.hbar .prog{flex:1;background:rgba(128,128,128,.22)}
.hbar b{width:112px;text-align:right;flex-shrink:0;font-weight:600}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Grid responsif */
.grid4{grid-template-columns:repeat(4,1fr)}
.dashgrid{grid-template-columns:5fr 7fr}
.dashgrid2{grid-template-columns:7fr 5fr}
.txgrid{grid-template-columns:4fr 8fr}
.sg2{grid-template-columns:5fr 7fr}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:980px){.grid4{grid-template-columns:1fr 1fr}.dashgrid,.dashgrid2,.txgrid,.sg2{grid-template-columns:1fr}
 #formcard{position:static!important}}
@media(max-width:860px){.dform{grid-template-columns:1fr 1fr!important}.dform>div:last-child{grid-column:1/-1}}
@media(max-width:560px){.grid4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:640px){.hide-sm{display:none}}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(15,13,10,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:440px;box-shadow:var(--shadow);animation:rise .2s ease;max-height:90vh;overflow-y:auto}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;bottom:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;
 box-shadow:var(--shadow);display:flex;gap:9px;align-items:flex-start;max-width:340px;animation:tin .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.97)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
</head>
<body>

<div class="app">
 <aside class="sidebar" id="sidebar">
  <a class="brand" href="#/dashboard">
   <svg viewBox="0 0 34 34" style="width:32px;height:32px;flex-shrink:0;color:var(--ink)">
    <rect x="1" y="1" width="32" height="32" rx="9" fill="currentColor"/>
    <path d="M10 12.5h14M10 17h14M10 21.5h9" stroke="var(--card)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="24" cy="21.5" r="2.2" fill="var(--pos)"/>
   </svg>
   <div>
    <div style="font-weight:800;letter-spacing:-.02em;font-size:15px">Arus</div>
    <div class="mono" style="font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--mut)">buku kas pribadi</div>
   </div>
  </a>
  <nav>
   <div class="lbl" style="padding:6px 10px 8px">Menu</div>
   <a href="#/dashboard" data-route="dashboard" class="navlink active"><svg class="w16"><use href="#i-grid"/></svg>Dashboard</a>
   <a href="#/transaksi" data-route="transaksi" class="navlink"><svg class="w16"><use href="#i-swap"/></svg>Transaksi</a>
   <a href="#/utang" data-route="utang" class="navlink"><svg class="w16"><use href="#i-scale"/></svg>Utang &amp; Piutang
    <span class="bcount" id="nav-badge">0</span></a>
   <a href="#/statistik" data-route="statistik" class="navlink"><svg class="w16"><use href="#i-chart"/></svg>Statistik</a>
   <a href="#/laporan" data-route="laporan" class="navlink"><svg class="w16"><use href="#i-file"/></svg>Laporan</a>
   <a href="#/pengaturan" data-route="pengaturan" class="navlink"><svg class="w16"><use href="#i-gear"/></svg>Pengaturan</a>
  </nav>

/* ── Helper ── */
const $=(s,r)=> (r||document).querySelector(s);
const $$=(s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const ic=(n,c)=>'<svg class="'+(c||'w16')+'" viewBox="0 0 24 24"><use href="#i-'+n+'"/></svg>';
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const todayISO=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const parseISO=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fmtDate=s=>{const d=parseISO(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
const monthName=ym=>{const a=ym.split('-');return MONF[a[1]-1]+' '+a[0];};
function fmtDay(s){const diff=Math.round((parseISO(todayISO())-parseISO(s))/864e5);
 if(diff===0)return 'Hari ini';if(diff===1)return 'Kemarin';if(diff===-1)return 'Besok';return fmtDate(s);}
const FMT=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const money=n=>FMT.format(Math.round(n)).replace(/\u00A0/g,' ');
function shortMoney(n){const a=Math.abs(n),s=n<0?'-':'';
 if(a>=1e9)return s+(a/1e9).toFixed(1).replace('.0','')+'M';
 if(a>=1e6)return s+(a/1e6).toFixed(1).replace('.0','')+'jt';
 if(a>=1e3)return s+Math.round(a/1e3)+'rb';return s+Math.round(a);}
const initials=n=>{const w=String(n||'?').trim().split(/\s+/).slice(0,2);return (w.map(x=>x[0]).join('')||'?').toUpperCase();};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'entri';

/* Jumlah fleksibel: "35k"→35.000, "2jt"→2.000.000, "1.234.500"→1234500 */
function parseAmt(str){
 let s=String(str||'').toLowerCase().trim().replace(/^rp\.?\s*/,'').replace(/\s/g,'');
 const m=s.match(/^([\d.,]+)(k|rb|jt|juta)?$/); if(!m)return 0;
 let num=m[1];const suf=m[2]||'';
 const dec=/^\d+[.,]\d{1,2}$/.test(num);
 if(!dec)num=num.replace(/[.,]/g,'');else num=num.replace(',','.');
 let n=parseFloat(num);if(isNaN(n))return 0;
 if(suf==='k'||suf==='rb')n*=1e3;
 if(suf==='jt'||suf==='juta')n*=1e6;
 return Math.round(n);
}
/* Deteksi jumlah yang ditulis di dalam deskripsi ("makan 85k") */
function detectAmt(desc){
 const re=/(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(k|rb|jt|juta)?(?!\d)/gi;
 let m,best=0;
 while((m=re.exec(desc||''))){
  const val=parseAmt(m[0]);
  if(!m[2]&&!/[.,]\d{3}/.test(m[1])&&val<10000)continue;
  if(val>best)best=val;
 }
 return best;
}

const KEY='arus-data-v2';

 add('income','Pemasukan Lain','Jual monitor lama di Tokopedia',650000,addDays(now,-55));

  ['Makanan & Minuman','Kopi — cafe lokal',20000,40000],

  ['Transportasi','Gojek ke kantor',18000,40000],

  ['Transportasi','Parkir & e-toll',12000,35000],
  ['Belanja','Shopee — kebutuhan rumah',50000,200000],
  ['Belanja','Uniqlo — diskon akhir pekan',120000,330000],
  ['Tagihan','Token listrik PLN',100000,250000],

  ['Hiburan','Langganan Netflix',54000,54000],
  ['Kesehatan','Apotek — vitamin',30000,110000],
  ['Pendidikan','Kelas online — data analysis',150000,350000]];
 for(let dd=170;dd>=2;dd-=2+Math.floor(Math.random()*4)){
  const p=pool[Math.floor(Math.random()*pool.length)];
  add('expense',p[0],p[1],Math.round((p[2]+Math.random()*(p[3]-p[2]))/500)*500,addDays(now,-dd));}
 add('expense','Makanan & Minuman','Makan siang — nasi goreng GoFood',27000,addDays(now,0));
 add('expense','Transportasi','Gojek ke kantor',28000,addDays(now,-1));
 const defs=[
  {name:'Budi Santoso',type:'receivable',amount:2500000,paid:1000000,due:12},
  {name:'Kartu Kredit BCA',type:'debt',amount:3250000,paid:1200000,due:5},

  {name:'Kontraktor renovasi tahap 2',type:'debt',amount:12000000,paid:0,due:24}];
 defs.forEach(x=>{
  const id=uid();
  D.push({id:id,name:x.name,type:x.type,amount:x.amount,paid_amount:x.paid,
   due_date:iso(addDays(now,x.due)),
   status:x.paid>=x.amount?'paid':(x.paid>0?'partially_paid':'unpaid'),
   settled_at:null,created_at:new Date(now.getTime()-86400000*20).toISOString()});
  if(x.paid>0)add(x.type==='debt'?'expense':'income',
   x.type==='debt'?'Cicilan / Utang':'Piutang',
   (x.type==='debt'?'Pembayaran utang — ':'Pembayaran diterima — ')+x.name,
   x.paid,addDays(now,-9),'settlement',id);});
 return {profile:{name:'Alex Laurel'},transactions:T,debts:D};
}
function load(){try{db=JSON.parse(localStorage.getItem(KEY));}catch(e){db=null;}
 if(!db||!Array.isArray(db.transactions)||!Array.isArray(db.debts)){db=seed();save();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
function syncTop(){const el=$('#top-bal');if(el)el.textContent=money(totals().balance);}
function addTransaction(o){
 o.id=uid();o.created_at=new Date().toISOString();
 if(!o.source)o.source='manual';if(o.ref_id===undefined)o.ref_id=null;
 db.transactions.push(o);save();syncTop();return o;
}
function deleteTransaction(id){
 const t=db.transactions.find(x=>x.id===id);
 db.transactions=db.transactions.filter(x=>x.id!==id);
 if(t&&t.ref_id){const d=db.debts.find(x=>x.id===t.ref_id);
  if(d){d.paid_amount=Math.max(0,d.paid_amount-t.amount);
   d.status=d.paid_amount>=d.amount?'paid':(d.paid_amount>0?'partially_paid':'unpaid');
   if(d.status!=='paid')d.settled_at=null;}}
 save();syncTop();
}
function addDebt(o){
 o.id=uid();o.paid_amount=0;o.status='unpaid';o.settled_at=null;
 o.created_at=new Date().toISOString();db.debts.push(o);save();
}
function deleteDebt(id){
 db.debts=db.debts.filter(x=>x.id!==id);
 db.transactions.forEach(t=>{if(t.ref_id===id)t.ref_id=null;});save();
}
function settleDebt(id,amt){
 const d=db.debts.find(x=>x.id===id);if(!d)return null;
 const remaining=d.amount-d.paid_amount;
 const pay=Math.max(0,Math.min(amt,remaining));if(pay<=0)return null;
 d.paid_amount+=pay;
 const done=d.paid_amount>=d.amount;
 d.status=done?'paid':(d.paid_amount>0?'partially_paid':'unpaid');
 if(done)d.settled_at=new Date().toISOString();
 addTransaction({type:d.type==='debt'?'expense':'income',
  category:d.type==='debt'?'Cicilan / Utang':'Piutang',
  description:(d.type==='debt'?'Pembayaran utang — ':'Pembayaran diterima — ')+d.name,
  amount:pay,occurred_at:todayISO(),source:'settlement',ref_id:d.id});
 return {pay:pay,done:done};
}
function totals(){
 let inc=0,exp=0;
 db.transactions.forEach(t=>{if(t.type==='income')inc+=t.amount;else exp+=t.amount;});
 const open=db.debts.filter(d=>d.status!=='paid');
 const pay=open.filter(d=>d.type==='debt').reduce((s,d)=>s+(d.amount-d.paid_amount),0);
 const rec=open.filter(d=>d.type==='receivable').reduce((s,d)=>s+(d.amount-d.paid_amount),0);
 return {inc:inc,exp:exp,balance:inc-exp,pay:pay,rec:rec,
  openP:open.filter(d=>d.type==='debt').length,
  openR:open.filter(d=>d.type==='receivable').length};
}
function monthSeries(n){
 const out=[],now=new Date();
 for(let i=n-1;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const ym=d.getFullYear()+'-'+p2(d.getMonth()+1);
  let inc=0,exp=0;
  db.transactions.forEach(t=>{if(t.occurred_at.indexOf(ym)===0){if(t.type==='income')inc+=t.amount;else exp+=t.amount;}});
  out.push({ym:ym,label:MON[d.getMonth()],inc:inc,exp:exp,net:inc-exp});
 }
 return out;
}
/* Semua transaksi terkait satu orang (settlement + deskripsi yang menyebut namanya) */
function relatedTxns(d){
 const nm=String(d.name).toLowerCase();if(nm.length<3)return db.transactions.filter(t=>t.ref_id===d.id);
 return db.transactions.filter(t=>t.ref_id===d.id||String(t.description||'').toLowerCase().indexOf(nm)>-1)
  .sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at));
}
/* Baris kartu utang/piutang: [tanggal, keterangan, tagihan, dibayar, sisa] */
function statementRows(d){
 const out=[];
 const created=(d.created_at||'').slice(0,10)||d.due_date||todayISO();
 out.push([fmtDate(created),'Pencatatan '+(d.type==='debt'?'utang':'piutang'),money(d.amount),'-',money(d.amount)]);
 let sisa=d.amount;
 const pays=db.transactions.filter(t=>t.ref_id===d.id).sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at));
 pays.forEach(p=>{sisa=Math.max(0,sisa-p.amount);
  out.push([fmtDate(p.occurred_at),d.type==='debt'?'Pembayaran utang':'Pembayaran diterima','-',money(p.amount),money(sisa)]);});
 return out;
}

/* Grafik batang — canvas murni (tanpa library) */
function drawChart(){
 const cv=$('#cash-chart');if(!cv||!cv.clientWidth)return;
 const S=monthSeries(6);
 const cs=getComputedStyle(document.documentElement);
 const pos=cs.getPropertyValue('--pos').trim(),neg=cs.getPropertyValue('--neg').trim(),
       ink=cs.getPropertyValue('--ink').trim(),mut=cs.getPropertyValue('--mut').trim(),
       line=cs.getPropertyValue('--line').trim();
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
 const padL=58,padR=8,padT=12,padB=26,pw=W-padL-padR,ph=H-padT-padB;
 const max=Math.max(1,Math.max.apply(null,S.map(s=>Math.max(s.inc,s.exp))))*1.15;
 const y=v=>padT+ph-(v/max)*ph;
 ctx.font='10px ui-monospace,Consolas,monospace';ctx.fillStyle=mut;ctx.textAlign='right';ctx.textBaseline='middle';
 for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);
  ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
  ctx.fillText(shortMoney(v),padL-8,yy);}
 const gw=pw/S.length,bw=Math.min(16,gw*0.26);
 function bar(x,y0,h,color){h=Math.max(h,.5);ctx.fillStyle=color;ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y0,bw,h,[3,3,0,0]);else ctx.rect(x,y0,bw,h);ctx.fill();}
 ctx.textAlign='center';ctx.textBaseline='alphabetic';
 S.forEach((s,i)=>{const cx=padL+gw*i+gw/2;
  bar(cx-bw-3,y(s.inc),padT+ph-y(s.inc),pos);
  bar(cx+3,y(s.exp),padT+ph-y(s.exp),neg);
  ctx.fillStyle=mut;ctx.fillText(s.label,cx,H-8);});
 ctx.strokeStyle=ink;ctx.setLineDash([5,4]);ctx.lineWidth=1.5;ctx.beginPath();
 S.forEach((s,i)=>{const cx=padL+gw*i+gw/2,yy=y(Math.max(0,s.net));if(i)ctx.lineTo(cx,yy);else ctx.moveTo(cx,yy);});
 ctx.stroke();ctx.setLineDash([]);
 S.forEach((s,i)=>{const cx=padL+gw*i+gw/2,yy=y(Math.max(0,s.net));
  ctx.fillStyle=ink;ctx.beginPath();ctx.arc(cx,yy,2.5,0,7);ctx.fill();});
}

function statRange(){
 if(ui.statPeriod==='bulan'){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1);}
 if(ui.statPeriod==='6bulan'){const now=new Date();return iso(new Date(now.getFullYear(),now.getMonth()-5,1));}
 return null;
}
function inPeriod(dateStr,from){
 if(!from)return true;
 if(from.length===7)return dateStr.indexOf(from)===0;
 return dateStr>=from;
}
function statData(){
 const from=statRange();
 const exp=db.transactions.filter(t=>t.type==='expense'&&inPeriod(t.occurred_at,from));
 const inc=db.transactions.filter(t=>t.type==='income'&&inPeriod(t.occurred_at,from));
 const map={};let total=0;
 exp.forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;total+=t.amount;});
 const list=Object.keys(map).map(c=>({cat:c,val:map[c]})).sort((a,b)=>b.val-a.val);
 list.forEach(x=>x.pct=total?Math.round(x.val/total*100):0);
 let days;
 const now=new Date();
 if(ui.statPeriod==='bulan')days=now.getDate();
 else if(ui.statPeriod==='6bulan')days=Math.max(1,Math.round((now-parseISO(iso(new Date(now.getFullYear(),now.getMonth()-5,1))))/864e5)+1);
 else{const first=db.transactions.reduce((m,t)=>t.occurred_at<m?t.occurred_at:m,todayISO());
  days=Math.max(1,Math.round((now-parseISO(first))/864e5)+1);}
 return {list:list,total:total,count:exp.length,avg:days?total/days:0,
  inc:inc.reduce((s,t)=>s+t.amount,0),
  biggest:exp.slice().sort((a,b)=>b.amount-a.amount).slice(0,5)};
}

function drawDonut(){
 const cv=$('#donut');if(!cv||!cv.clientWidth)return;
 const D=statData().list;
 const cs=getComputedStyle(document.documentElement);
 const ink=cs.getPropertyValue('--ink').trim(),mut=cs.getPropertyValue('--mut').trim(),
       line=cs.getPropertyValue('--line').trim();
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
 const cx=W/2,cy=H/2,R=Math.min(cy-14,92),th=R*0.44;
 if(!D.length){ctx.fillStyle=mut;ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('Belum ada pengeluaran',cx,cy);return;}
 const total=D.reduce((s,x)=>s+x.val,0);
 let a=-Math.PI/2;
 D.forEach(x=>{
  const ang=x.val/total*Math.PI*2;
  ctx.beginPath();ctx.arc(cx,cy,R,a+0.02,Math.max(a+0.03,a+ang-0.02));
  ctx.strokeStyle=catDot(x.cat);ctx.lineWidth=th;ctx.lineCap='butt';ctx.stroke();
  a+=ang;});
 ctx.beginPath();ctx.arc(cx,cy,R+th/2+1,0,7);ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle=ink;ctx.font='700 17px ui-monospace,Consolas,monospace';ctx.textAlign='center';
 ctx.fillText(shortMoney(total),cx,cy-2);
 ctx.fillStyle=mut;ctx.font='8px ui-monospace,Consolas,monospace';
 ctx.fillText('PENGELUARAN',cx,cy+14);
}

function afterPengaturan(){
 $('#p-save').onclick=()=>{
  const v=$('#p-name').value.trim();
  if(!v){toast('Nama tidak boleh kosong.','error');return;}
  db.profile.name=v;save();updateProfileUI();toast('Nama diperbarui.');render();};
 $('#theme-set').addEventListener('click',e=>{
  const b=e.target.closest('button[data-th]');if(!b)return;
  const want=b.getAttribute('data-th')==='dark';
  if(want!==document.documentElement.classList.contains('dark'))toggleTheme();});
 $('#exp-btn').onclick=exportJSON;
 $('#imp-btn').onclick=()=>$('#imp-file').click();
 $('#imp-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
   try{
    const j=JSON.parse(rd.result);
    if(!j||!Array.isArray(j.transactions)||!Array.isArray(j.debts))throw 0;
    confirmModal('Impor data?','Data saat ini akan DIGANTI dengan isi file '+esc(f.name)+
     ' ('+j.transactions.length+' transaksi, '+j.debts.length+' entri utang/piutang).',()=>{
      db={profile:j.profile||{name:'Saya'},transactions:j.transactions,debts:j.debts};
      save();updateProfileUI();render();toast('Data berhasil diimpor.');},true);
   }catch(err){toast('File tidak valid — gunakan backup JSON dari aplikasi ini.','error');}
  };
  rd.readAsText(f);e.target.value='';});
 $('#reset-btn').onclick=()=>confirmModal('Reset semua data?',
  'Seluruh transaksi & utang/piutang lokal dihapus lalu diisi ulang data contoh.',()=>{
   localStorage.removeItem(KEY);db=seed();save();render();toast('Data contoh dimuat ulang.','info');},true);
 $('#wipe-btn').onclick=()=>confirmModal('Hapus SEMUA data?',
  'Semua transaksi dan utang/piutang dihapus permanen dari browser ini. Aplikasi akan kosong.',()=>{
   db={profile:db.profile,transactions:[],debts:[]};save();render();toast('Semua data dihapus.','info');},true);
}
function exportJSON(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='arus-backup-'+todayISO()+'.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast('Backup JSON diunduh.');
}

/* ═══ Ekspor PDF (jsPDF + autotable; fallback: menu cetak browser) ═══ */
const PDF={ink:[45,42,36],paper:[244,241,232],mut:[150,144,128],hdr:[30,27,21],boxBg:[247,245,238],boxLine:[224,219,206],boxMut:[130,124,108]};
function pdfBase(){return {theme:'grid',
 styles:{font:'helvetica',fontSize:8.5,cellPadding:{top:5,bottom:5,left:6,right:6},lineColor:PDF.boxLine,lineWidth:.5,textColor:PDF.ink},
 headStyles:{fillColor:PDF.hdr,textColor:PDF.paper,fontSize:8,lineWidth:0},
 alternateRowStyles:{fillColor:PDF.boxBg},
 margin:{left:48,right:48,top:46,bottom:56}};}
function pdfHead(doc,title,sub,rightBold,rightMut){
 const W=doc.internal.pageSize.getWidth();
 doc.setFillColor(PDF.hdr[0],PDF.hdr[1],PDF.hdr[2]);doc.rect(0,0,W,88,'F');
 doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(PDF.paper[0],PDF.paper[1],PDF.paper[2]);doc.text(title,48,36);
 doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(sub,48,58);
 doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(rightBold,W-48,36,{align:'right'});
 doc.setFont('helvetica','normal');doc.setTextColor(168,162,146);doc.text(rightMut,W-48,58,{align:'right'});
}
function pdfBoxes(doc,items){
 const W=doc.internal.pageSize.getWidth(),M=48,n=items.length;
 const bw=(W-2*M-(n-1)*10)/n;
 items.forEach((it,i)=>{const x=M+i*(bw+10);
  doc.setFillColor(PDF.boxBg[0],PDF.boxBg[1],PDF.boxBg[2]);doc.setDrawColor(PDF.boxLine[0],PDF.boxLine[1],PDF.boxLine[2]);
  doc.setLineWidth(.6);doc.roundedRect(x,104,bw,56,6,6,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(PDF.boxMut[0],PDF.boxMut[1],PDF.boxMut[2]);
  doc.text(it[0].toUpperCase(),x+9,122);
  doc.setFontSize(String(it[1]).length>14?9.5:11.5);doc.setTextColor(it[2][0],it[2][1],it[2][2]);
  doc.text(String(it[1]),x+9,146);});
}
function pdfFooter(doc,period){
 const H=doc.internal.pageSize.getHeight(),W=doc.internal.pageSize.getWidth();
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);
  doc.setDrawColor(PDF.boxLine[0],PDF.boxLine[1],PDF.boxLine[2]);doc.setLineWidth(.5);doc.line(48,H-44,W-48,H-44);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(PDF.mut[0],PDF.mut[1],PDF.mut[2]);
  doc.text('Arus — pencatatan keuangan pribadi · '+period,48,H-30);
  doc.text('Halaman '+i+' dari '+n,W-48,H-30,{align:'right'});}
}
function pdfContHead(period){
 return d=>{if(d.internal.getCurrentPageInfo().pageNumber>1){
  d.setFont('helvetica','bold');d.setFontSize(8);d.setTextColor(PDF.ink[0],PDF.ink[1],PDF.ink[2]);
  d.text('Arus — '+period+' (lanjutan)',48,28);}};
}

  head:[['Tanggal','Keterangan','Kategori','Jenis','Jumlah']],
  body:F.txns.length?F.txns.map(t=>[fmtDate(t.occurred_at),t.description,t.category,t.type==='income'?'Masuk':'Keluar',(t.type==='income'?'+ ':'- ')+money(t.amount)]):[['-','Tidak ada transaksi pada periode ini','','','']],
  columnStyles:{0:{cellWidth:64},2:{cellWidth:95},3:{cellWidth:46},4:{cellWidth:95,halign:'right'}},
  didParseCell:d=>{if(d.section==='body'&&d.column.index===4&&String(d.row.raw[4]).length>1){
   d.cell.styles.fontStyle='bold';
   d.cell.styles.textColor=String(d.row.raw[4]).trim().charAt(0)==='+'?[14,123,79]:[193,78,51];}}}));
 let y=doc.lastAutoTable.finalY+28;
 if(y>H-150){doc.addPage();y=64;}
 doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(PDF.ink[0],PDF.ink[1],PDF.ink[2]);
 doc.text('Utang & Piutang',48,y);
 doc.autoTable(Object.assign(base,{startY:y+8,
  head:[['Nama','Jenis','Tagihan','Dibayar','Jatuh Tempo','Status']],
  body:F.debts.length?F.debts.map(d=>[d.name,d.type==='debt'?'Utang':'Piutang',money(d.amount),money(d.paid_amount),d.due_date?fmtDate(d.due_date):'-',STATUS[d.status][0]]):[['Tidak ada entri pada periode ini','','','','','']],
  columnStyles:{2:{halign:'right',cellWidth:86},3:{halign:'right',cellWidth:78},4:{cellWidth:68},5:{cellWidth:82}}}));
 pdfFooter(doc,'Laporan '+period);
 doc.save('arus-laporan-'+(F.ym||'semua')+'.pdf');
 toast('Laporan '+period+' diunduh (PDF).');
}

/* ── Router, tema & init ── */
const ROUTES={
 dashboard:{t:'Dashboard',sub:'Ringkasan keuangan',p:pageDashboard,a:afterDashboard},
 transaksi:{t:'Transaksi',sub:'Input pintar & daftar',p:pageTransactions,a:afterTransactions},
 utang:{t:'Utang & Piutang',sub:'Kewajiban & tagihan',p:pageDebts,a:afterDebts},
 statistik:{t:'Statistik',sub:'Analisis pengeluaran',p:pageStatistik,a:afterStatistik},
 laporan:{t:'Laporan',sub:'Rekap & unduh PDF',p:pageReports,a:afterReports},
 pengaturan:{t:'Pengaturan',sub:'Profil, tema & data',p:pagePengaturan,a:afterPengaturan}
};
function route(){const h=location.hash.replace(/^#\//,'');return ROUTES[h]?h:'dashboard';}
function render(){
 const r=route();ui.route=r;
 $$('.navlink').forEach(a=>a.classList.toggle('active',a.getAttribute('data-route')===r));
 $('#page-title').textContent=ROUTES[r].t;
 $('#page-sub').textContent=ROUTES[r].sub;
 $('#view').innerHTML=ROUTES[r].p();
 if(ROUTES[r].a)ROUTES[r].a();
 $('#nav-badge').textContent=db.debts.filter(d=>d.status!=='paid').length;
 syncTop();closeNav();
}
function goAdd(){
 if(ui.route==='transaksi'){const el=$('#f-desc');if(el)el.focus();else pendingFocus=true;}
 else{pendingFocus=true;location.hash='#/transaksi';}
}
function closeNav(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');}
function updateProfileUI(){
 $('#avatar').textContent=initials(db.profile.name||'Saya');
 $('#profile-name').textContent=db.profile.name||'Saya';
}
function applyThemeUI(){
 const dk=document.documentElement.classList.contains('dark');
 $('#theme-ic').innerHTML=ic(dk?'sun':'moon');
 $('#theme-ic2').innerHTML=ic(dk?'sun':'moon');
 $('#theme-lbl').textContent=dk?'Mode terang':'Mode gelap';
}
function toggleTheme(){
 document.documentElement.classList.toggle('dark');
 try{localStorage.setItem('arus-theme',document.documentElement.classList.contains('dark')?'dark':'light');}catch(e){}
 applyThemeUI();render();
}

load();
applyThemeUI();
updateProfileUI();
render();
window.addEventListener('hashchange',render);
window.addEventListener('resize',()=>{if(ui.route==='dashboard')drawChart();if(ui.route==='statistik')drawDonut();});
 $('#menu-btn').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('show');};
 $('#scrim').onclick=closeNav;
 $('#theme-top').onclick=toggleTheme;
 $('#theme-row').onclick=toggleTheme;
 $('#add-btn').onclick=goAdd;
 $('#profile-btn').onclick=()=>{
 openModal('<h3 style="font-weight:800;font-size:16px">Nama tampilan</h3>'+
  '<label class="lbl" style="margin-top:14px">Nama</label>'+
  '<input id="p-name" class="fld" value="'+esc(db.profile.name||'')+'" maxlength="40">'+
  '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:18px">'+
  '<button class="btn" data-close>Batal</button><button class="btn primary" id="p-ok">Simpan</button></div>');
 $('#p-ok').onclick=()=>{const v=$('#p-name').value.trim();
  if(!v){toast('Nama tidak boleh kosong.','error');return;}
  db.profile.name=v;save();updateProfileUI();
  closeModal();toast('Nama diperbarui.');render();};
};
/* Delegasi klik global */
document.addEventListener('click',e=>{
 if(e.target.closest('.navlink'))closeNav();
 const cl=e.target.closest('[data-close]');if(cl){closeModal();return;}
 const st=e.target.closest('[data-settle]');if(st){settleModal(st.getAttribute('data-settle'));return;}
 const hs=e.target.closest('[data-history]');if(hs){historyModal(hs.getAttribute('data-history'));return;}
 const pp=e.target.closest('[data-personpdf]');if(pp){exportPersonPDF(pp.getAttribute('data-personpdf'));return;}
 const dt=e.target.closest('[data-deltxn]');
 if(dt){confirmModal('Hapus transaksi?','Entri dihapus dan saldo dihitung ulang. Jika ini pembayaran utang/piutang, statusnya ikut disesuaikan.',
  ()=>{deleteTransaction(dt.getAttribute('data-deltxn'));toast('Transaksi dihapus.','info');render();},true);return;}
 const dd=e.target.closest('[data-deldebt]');
 if(dd){confirmModal('Hapus entri ini?','Entri utang/piutang dihapus. Pembayaran yang sudah tercatat tetap ada di daftar transaksi.',
  ()=>{deleteDebt(dd.getAttribute('data-deldebt'));toast('Entri dihapus.','info');render();},true);return;}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return;}
 if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='n'){e.preventDefault();goAdd();}
});
</script>
