name = "arus-kas"
main = "worker/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Static assets (landing page + arus.html + admin.html + _next/static)
[assets]
directory = "./out"
binding = "ASSETS"

[vars]
SUPABASE_URL = "https://evntvbqrprizgqogjyva.supabase.co"
MIDTRANS_IS_PRODUCTION = "false"
ADMIN_EMAIL = "riskiakbarp123@gmail.com"

# ── KV Namespace ──
# PRODUCTION: Uncomment and paste real IDs after running:
#   npx wrangler kv namespace create "ARUS_KV"
# [[kv_namespaces]]
# binding = "ARUS_KV"
# id = "PASTE_KV_ID_HERE"
# preview_id = "PASTE_KV_PREVIEW_ID_HERE"

# ── R2 Bucket ──
# PRODUCTION: Uncomment after running:
#   npx wrangler r2 bucket create "arus-storage"
# [[r2_buckets]]
# binding = "ARUS_STORAGE"
# bucket_name = "arus-storage"

# ── Cron Triggers ──
[triggers]
crons = ["0 2 * * *"]

# ── Secrets (set via: npx wrangler secret put NAME) ──
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY
# MIDTRANS_SERVER_KEY
# RESEND_API_KEY
