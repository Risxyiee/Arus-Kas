*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F4F1E8;--card:#FFFFFF;--soft:#ECE8DB;--line:#E2DCCC;--ink:#242019;--mut:#8B8471;
 --pos:#0E7B4F;--pos-soft:#DFF0E6;--neg:#C14E33;--neg-soft:#F9E8E1;--warn:#97741F;--warn-soft:#F5EDD5;
 --shadow:0 12px 32px rgba(30,27,21,.10);

.dark{--bg:#16140F;--card:#211E17;--soft:#2B2820;--line:#393428;--ink:#EFEBDE;--mut:#A39B85;
 --pos:#4EC38A;--pos-soft:#20342A;--neg:#E8825F;--neg-soft:#3C2820;--warn:#D8A94E;--warn-soft:#39311C;
 --shadow:0 12px 32px rgba(0,0,0,.4);
 --inv:#F1EDE1;--invfg:#1C1912;--invmut:#6F6957;--invpos:#0E7B4F;--invneg:#C14E33}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
 background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
.w10{width:10px;height:10px}.w12{width:12px;height:12px}.w14{width:14px;height:14px}.w16{width:16px;height:16px}.w20{width:20px;height:20px}
.muted{color:var(--mut)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.small{font-size:12.5px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.right{text-align:right}.grow{flex:1}.minw{min-width:0}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:252px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
 display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.sidebar nav{padding:10px 12px;flex:1;overflow-y:auto}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);
 text-decoration:none;font-weight:600;font-size:13.5px;transition:.15s;width:100%;font-family:inherit;cursor:pointer;border:none;background:none;text-align:left}
.navlink svg{flex-shrink:0}
.navlink:hover{color:var(--ink);background:var(--soft)}
.navlink.active{background:var(--ink);color:var(--bg)}
.bcount{margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:10px;background:var(--soft);color:var(--mut);padding:1px 7px;border-radius:6px}
.navlink.active .bcount{background:rgba(255,255,255,.2);color:var(--bg)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:0 20px;height:62px;border-bottom:1px solid var(--line);
 background:var(--bg);position:sticky;top:0;z-index:20}
.balpill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(15,13,10,.45);z-index:55;display:none}
.scrim.show{display:block}
#view{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 20px 40px}

 .menu-btn{display:inline-flex}.balpill{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
 background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;
 cursor:pointer;transition:.15s;font-family:inherit;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.danger:hover{background:var(--neg);opacity:.9}
.btn.mini{padding:5px 10px;font-size:11.5px;border-radius:8px;gap:5px}
.btn.icon{padding:8px;position:relative}
.btn:focus-visible,.fld:focus-visible{outline:2px solid var(--pos);outline-offset:2px}
.fld{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;

.fld:focus{border-color:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
.lbl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:5px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}

.seg button.on{background:var(--ink);color:var(--bg)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);

td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--soft)}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;background:var(--card)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.b-unpaid{background:var(--soft);color:var(--mut)}
.b-part{background:var(--warn-soft);color:var(--warn)}
.b-paid{background:var(--pos-soft);color:var(--pos)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;background:var(--soft);border-radius:99px;padding:3px 9px;white-space:nowrap}
.cdot{width:8px;height:8px;border-radius:99px;display:inline-block;flex-shrink:0}

.tagx{background:var(--soft);border-radius:4px;padding:1px 5px;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.avatar{width:34px;height:34px;border-radius:99px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sicon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.locked::after{content:'Pro';position:absolute;top:6px;right:6px;background:var(--pos);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.06em}
.iconbtn{border:none;background:none;color:var(--mut);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex}

.dot{width:8px;height:8px;border-radius:99px;background:var(--invpos);position:relative;flex-shrink:0}

@media(max-width:560px){.plan-grid{grid-template-columns:1fr;max-width:400px}}
@media(max-width:640px){.hide-sm{display:none}}
.overlay{position:fixed;inset:0;background:rgba(15,13,10,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:440px;box-shadow:var(--shadow);animation:rise .2s ease;max-height:90vh;overflow-y:auto}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;bottom:18px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;
 box-shadow:var(--shadow);display:flex;gap:9px;align-items:flex-start;max-width:360px;animation:tin .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tin{from{opacity:0;transform:translateY(8px) scale(.97)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
/* Kunci PIN */
#pinlock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#pinlock.shake .panel{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--pos);cursor:pointer}
.admin-tab{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:12px;font-weight:600;cursor:pointer}
.admin-tab.active{background:var(--ink);color:var(--invfg);border-color:var(--ink)}
.admin-tab:hover{opacity:.85}
</style>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════
   ARUS v3.0 — skema mengikuti Supabase + tabel baru:
   wallets(id,name,color,initial) · budgets · customCats
   transactions(+wallet_id,recur,recur_parent) · debts
   ═══════════════════════════════════════════════════════════ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const ic=(n,c)=>'<svg class="'+(c||'w16')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const todayISO=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const parseISO=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addMonthsISO=dstr=>{const d=parseISO(dstr);const n=new Date(d.getFullYear(),d.getMonth()+1,1);
 n.setDate(Math.min(d.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));return iso(n);};
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const fmtDate=s=>{const d=parseISO(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();};
const monthName=ym=>{const a=ym.split('-');return MONF[a[1]-1]+' '+a[0];};
function fmtDay(s){const diff=Math.round((parseISO(todayISO())-parseISO(s))/864e5);
 if(diff===0)return 'Hari ini';if(diff===1)return 'Kemarin';if(diff===-1)return 'Besok';return fmtDate(s);}
const FMT=new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0});
const money=n=>FMT.format(Math.round(n)).replace(/\u00A0/g,' ');
function shortMoney(n){const a=Math.abs(n),s=n<0?'-':'';
 if(a>=1e9)return s+(a/1e9).toFixed(1).replace('.0','')+'M';
 if(a>=1e6)return s+(a/1e6).toFixed(1).replace('.0','')+'jt';
 if(a>=1e3)return s+Math.round(a/1e3)+'rb';return s+Math.round(a);}
const initials=n=>{const w=String(n||'?').trim().split(/\s+/).slice(0,2);return (w.map(x=>x[0]).join('')||'?').toUpperCase();};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'entri';
function parseAmt(str){
 let s=String(str||'').toLowerCase().trim().replace(/^rp\.?\s*/,'').replace(/\s/g,'');
 const m=s.match(/^([\d.,]+)(k|rb|jt|juta)?$/);if(!m)return 0;
 let num=m[1];const suf=m[2]||'';
 const dec=/^\d+[.,]\d{1,2}$/.test(num);
 if(!dec)num=num.replace(/[.,]/g,'');else num=num.replace(',','.');
 let n=parseFloat(num);if(isNaN(n))return 0;
 if(suf==='k'||suf==='rb')n*=1e3;if(suf==='jt'||suf==='juta')n*=1e6;
 return Math.round(n);}
function detectAmt(desc){
 const re=/(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+|\d+(?:[.,]\d+)?)\s*(k|rb|jt|juta)?(?!\d)/gi;
 let m,best=0;
 while((m=re.exec(desc||''))){const val=parseAmt(m[0]);
  if(!m[2]&&!/[.,]\d{3}/.test(m[1])&&val<10000)continue;
  if(val>best)best=val;}
 return best;}

/* ── Kategori (bawaan + kustom) ── */
const KW_EXP={
 'Makanan & Minuman':['makan','bakso','mie','nasi','ayam','kopi','cafe','kafe','resto','restoran','warung','warteg','gofood','grabfood','shopeefood','snack','lunch','dinner','breakfast','food','minum','jus','roti','sate','soto','padang','seblak','boba','starbucks','kfc','mcd','burger','pizza','grocer','sarapan','catering'],
 'Transportasi':['bensin','pertalite','pertamax','tol','e-toll','etoll','parkir','gojek','grab','uber','ojek','taksi','taxi','krl','mrt','transjakarta','busway','kereta','bus','commuter','transport','fuel','bbm'],
 'Belanja':['shopee','tokopedia','lazada','bukalapak','blibli','uniqlo','zara','baju','kaos','celana','sepatu','sandal','tas','belanja','mall','skincare','kosmetik','amazon','clothes'],
 'Tagihan':['listrik','pln','token','pdam','internet','wifi','indihome','biznet','pulsa','paket data','telkomsel','indosat','bpjs','iuran','tagihan'],
 'Hiburan':['netflix','spotify','disney','vidio','youtube','bioskop','cgv','xxi','cinema','movie','game','steam','genshin','konser','tiket','hiburan'],
 'Kesehatan':['apotek','obat','dokter','klinik','rumah sakit','hospital','vitamin','gym','fitness','puskesmas'],
 'Pendidikan':['kursus','les','sekolah','kuliah','spp','buku','udemy','coursera','kelas','training','seminar'],
 'Cicilan / Utang':['cicilan','angsuran','pinjam','pinjaman','utang','kredit','loan','paylater']};
const KW_INC={
 'Gaji':['gaji','salary','payroll','paycheck','thr','upah'],
 'Freelance':['freelance','proyek','project','klien','client','jasa','desain','invoice'],
 'Investasi':['dividen','dividend','bunga','interest','saham','crypto','reksadana','kupon'],
 'Pemasukan Lain':['jual','terjual','refund','cashback','hadiah','bonus','subsidi']};
const EXP_LIST0=Object.keys(KW_EXP).concat(['Lainnya']);
const INC_LIST0=Object.keys(KW_INC).concat(['Piutang','Pemasukan Lain']);
const CAT_COLOR={'Makanan & Minuman':'#C7723B','Transportasi':'#3E8FA8','Belanja':'#A75686','Tagihan':'#B8862F','Hiburan':'#7A6BC9','Kesehatan':'#4E9B6E','Pendidikan':'#5A72B8','Cicilan / Utang':'#C14E33','Lainnya':'#8B8474','Gaji':'#0E7C55','Freelance':'#2F9E77','Investasi':'#1F7A5C','Piutang':'#0E7C55','Pemasukan Lain':'#5C9E7E'};
const CUST_PAL=['#D0693B','#4A8FB5','#B05590','#C09A2E','#8468D6','#3FA070','#5F76C4','#A8643C'];
function applyCustomCats(){(db.customCats||[]).forEach(c=>{CAT_COLOR[c.name]=c.color;});}
function expCats(){return EXP_LIST0.concat((db.customCats||[]).filter(c=>c.type==='expense').map(c=>c.name));}
function incCats(){return INC_LIST0.concat((db.customCats||[]).filter(c=>c.type==='income').map(c=>c.name));}
const catDot=c=>CAT_COLOR[c]||'#8B8474';
function smartScan(desc,type){
 const s=String(desc||'').toLowerCase();if(!s)return null;
 const map=type==='income'?KW_INC:KW_EXP;
 const keys=Object.keys(map);
 for(let i=0;i<keys.length;i++){const cat=keys[i];
  for(let j=0;j<map[cat].length;j++)if(s.indexOf(map[cat][j])>-1)return cat;}
 for(let i=0;i<(db.customCats||[]).length;i++){const c=db.customCats[i];
  if(c.type===(type==='income'?'income':'expense')&&c.kw&&c.kw.some(k=>s.indexOf(k)>-1))return c.name;}
 return null;}

/* ══════ PLANS & Monetisasi ══════ */
const PLANS={
 free:{id:'free',name:'Gratis',price:0,period:'',color:'plan-free',
  wallets:2,debts:5,budgets:3,recurring:false,cloudSync:false,
  customCats:3,invoice:false,plReport:false,brandedPdf:false,
  notifPush:false},
 pro:{id:'pro',name:'Pro',price:29000,period:'/bln',color:'plan-pro',
  wallets:Infinity,debts:Infinity,budgets:Infinity,recurring:true,cloudSync:true,
  customCats:Infinity,invoice:true,plReport:true,brandedPdf:true,
  notifPush:true}};
const PLAN_ORDER=['free','pro'];
function getPlan(){return PLANS[(db.subscription&&db.subscription.plan)||'free'];}
function planName(){const p=getPlan();return p.id==='free'?'Gratis':p.name;}
function planBadge(){const p=getPlan();return '<span class="plan-pill '+p.color+'">'+p.name.toUpperCase()+'</span>';}
function canDo(feature){const p=getPlan();return p[feature]!==false&&p[feature]!==0;}
function planLimit(feature){const p=getPlan();return p[feature]||0;}
function planUsage(feature){
 if(feature==='wallets')return db.wallets.length;
 if(feature==='debts')return db.debts.filter(d=>d.status!=='paid').length;
 if(feature==='budgets')return Object.keys(db.budgets||{}).length;
 if(feature==='customCats')return(db.customCats||[]).length;
 return 0;}
function atLimit(feature){const lim=planLimit(feature);if(lim===Infinity)return false;return planUsage(feature)>=lim;}
function nearLimit(feature){const lim=planLimit(feature);if(lim===Infinity)return false;return planUsage(feature)>=lim*0.8;}
function limitLabel(feature){
 const lim=planLimit(feature),used=planUsage(feature);
 if(lim===Infinity)return used+' / ∞';
 return used+' / '+lim;}
function showUpgrade(feature,msg){
 const plan=getPlan();
 if(plan.id==='free'){openUpgradeModal(feature,msg);return true;}
 return false;}
function openUpgradeModal(feature,msg){
 const allFeats={
  wallets:'Multi-dompet unlimited',debts:'Utang & piutang unlimited',budgets:'Budget unlimited',
  recurring:'Transaksi berulang bulanan',cloudSync:'Sinkronisasi cloud (multi-device)',
  customCats:'Kategori kustom unlimited',invoice:'Buat & kirim invoice',
  plReport:'Laporan P&L (laba-rugi)',brandedPdf:'PDF dengan logo usaha',
  notifPush:'Notifikasi jatuh tempo push'};
 const featLabel=allFeats[feature]||feature;
 openModal(
  '<div style="text-align:center;padding:8px 0">'+
  '<div style="display:inline-flex;color:var(--pos);margin-bottom:6px">'+ic('crown','w20')+'</div>'+
  '<h3 style="font-weight:800;font-size:17px">Upgrade ke Pro</h3>'+
  (msg?'<p class="small muted" style="margin-top:6px;line-height:1.5">'+esc(msg)+'</p>':
   '<p class="small muted" style="margin-top:6px;line-height:1.5">'+esc(featLabel)+' tersedia di paket <b>Pro</b>.</p>')+
  '<div class="mono" style="font-size:28px;font-weight:800;margin-top:14px;color:var(--pos)">Rp 29.000<span class="muted" style="font-size:12px;font-weight:400">/bln</span></div>'+
  '</div>'+
  '<div style="margin-top:16px">'+
  '<button class="btn primary" id="up-confirm" style="width:100%;justify-content:center;gap:8px">'+ic('crown','w14')+' Upgrade ke Pro</button>'+
  '<button class="btn" id="up-all" style="width:100%;margin-top:8px;justify-content:center">Lihat detail paket</button>'+
  '<button class="btn" data-close style="width:100%;margin-top:8px;justify-content:center">Nanti dulu</button>'+

function apiHeaders() {
  const h = {'Content-Type':'application/json'};
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

async function api(path, opts = {}) {
  try {
    const res = await fetch(API + '/api' + path, {headers: apiHeaders(), ...opts});
    const text = await res.text();
    try { return JSON.parse(text); } catch {
      return {error: 'Server error: respons bukan JSON. Pastikan API sudah berjalan.'};
    }
  } catch(e) { return {error: e.message || 'Koneksi gagal'}; }
}

function addTransaction(o){
 o.id=uid();o.created_at=new Date().toISOString();
 if(!o.source)o.source='manual';if(o.ref_id===undefined)o.ref_id=null;
 if(!o.recur)o.recur='none';if(!o.recur_parent)o.recur_parent=null;
 if(!o.wallet_id)o.wallet_id=(db.wallets[0]||{}).id;
 db.transactions.push(o);save();syncTop();return o;}
function recomputeDebt(ref){
 if(!ref)return;const d=db.debts.find(x=>x.id===ref);if(!d)return;
 let paid=0;db.transactions.forEach(t=>{if(t.ref_id===ref)paid+=t.amount;});
 d.paid_amount=Math.min(d.amount,paid);
 d.status=d.paid_amount>=d.amount?'paid':(d.paid_amount>0?'partially_paid':'unpaid');
 if(d.status==='paid'&&!d.settled_at)d.settled_at=new Date().toISOString();
 if(d.status!=='paid')d.settled_at=null;}
function deleteTransaction(id){
 const t=db.transactions.find(x=>x.id===id);if(!t)return;
 const ref=t.ref_id;
 db.transactions=db.transactions.filter(x=>x.id!==id);
 recomputeDebt(ref);
 save();syncTop();
 stashUndo('txn',[t]);}
function updateTransaction(id,patch){
 const t=db.transactions.find(x=>x.id===id);if(!t)return;
 const oldRef=t.ref_id;
 Object.assign(t,patch);save();syncTop();
 recomputeDebt(oldRef);
 if(patch.ref_id&&patch.ref_id!==oldRef)recomputeDebt(patch.ref_id);}
function addDebt(o){
 o.id=uid();o.paid_amount=0;o.status='unpaid';o.settled_at=null;
 o.note=o.note||'';
 o.created_at=new Date().toISOString();db.debts.push(o);save();}
function deleteDebt(id){
 const d=db.debts.find(x=>x.id===id);if(!d)return;
 db.debts=db.debts.filter(x=>x.id!==id);
 save();stashUndo('debt',[d]);}
function updateDebt(id,patch){
 const d=db.debts.find(x=>x.id===id);if(!d)return;
 Object.assign(d,patch);
 d.paid_amount=Math.min(d.paid_amount,d.amount);
 d.status=d.paid_amount>=d.amount?'paid':(d.paid_amount>0?'partially_paid':'unpaid');
 if(d.status==='paid'&&!d.settled_at)d.settled_at=new Date().toISOString();
 save();}
function settleDebt(id,amt){
 const d=db.debts.find(x=>x.id===id);if(!d)return null;
 const remaining=d.amount-d.paid_amount;
 const pay=Math.max(0,Math.min(amt,remaining));if(pay<=0)return null;
 const t=addTransaction({type:d.type==='debt'?'expense':'income',
  category:d.type==='debt'?'Cicilan / Utang':'Piutang',
  description:(d.type==='debt'?'Pembayaran utang — ':'Pembayaran diterima — ')+d.name,
  amount:pay,occurred_at:todayISO(),source:'settlement',ref_id:d.id});
 recomputeDebt(d.id);save();
 return {pay:pay,done:d.status==='paid'};}

 let inc=0,exp=0;
 db.transactions.forEach(t=>{if(t.type==='income')inc+=t.amount;else exp+=t.amount;});
 const open=db.debts.filter(d=>d.status!=='paid');
 const pay=open.filter(d=>d.type==='debt').reduce((s,d)=>s+(d.amount-d.paid_amount),0);
 const rec=open.filter(d=>d.type==='receivable').reduce((s,d)=>s+(d.amount-d.paid_amount),0);
 return {inc:inc,exp:exp,balance:inc-exp+db.wallets.reduce((s,w)=>s+(w.initial||0),0),
  pay:pay,rec:rec,
  openP:open.filter(d=>d.type==='debt').length,
  openR:open.filter(d=>d.type==='receivable').length};}
function monthTotals(ym){
 let inc=0,exp=0;
 db.transactions.forEach(t=>{if(t.occurred_at.indexOf(ym)===0){
  if(t.type==='income')inc+=t.amount;else exp+=t.amount;}});
 return {inc:inc,exp:exp,net:inc-exp,
  sr:inc>0?Math.round((inc-exp)/inc*100):null};}

 const out=[],now=new Date();
 for(let i=n-1;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const ym=d.getFullYear()+'-'+p2(d.getMonth()+1);

  out.push({ym:ym,label:MON[d.getMonth()],inc:m.inc,exp:m.exp,net:m.net,sr:m.sr});}

/* ── Transaksi berulang: generate instance yang jatuh tempo ── */
function processRecurring(){
 let added=0,guard=0;
 db.transactions.filter(t=>t.recur==='monthly').forEach(tpl=>{
  let last=tpl.occurred_at;
  db.transactions.forEach(x=>{if(x.recur_parent===tpl.id&&x.occurred_at>last)last=x.occurred_at;});
  let next=addMonthsISO(last);
  while(next<=todayISO()&&guard++<60){
   db.transactions.push({id:uid(),type:tpl.type,amount:tpl.amount,category:tpl.category,
    description:tpl.description,occurred_at:next,source:'recur',ref_id:null,
    wallet_id:tpl.wallet_id,recur:'none',recur_parent:tpl.id,
    created_at:new Date().toISOString()});
   added++;last=next;next=addMonthsISO(last);}});
 if(added){save();syncTop();}
 return added;}

let undoStack=null;
function stashUndo(kind,items){undoStack={kind:kind,items:items};}
function doUndo(){
 if(!undoStack)return;const u=undoStack;undoStack=null;
 if(u.kind==='txn')u.items.forEach(t=>db.transactions.push(t));
 if(u.kind==='debt')u.items.forEach(d=>db.debts.push(d));
 save();syncTop();render();toast('Dipulihkan.');}

function drawChart(){
 const cv=$('#cash-chart');if(!cv||!cv.clientWidth)return;
 const S=monthSeries(6);
 const cs=getComputedStyle(document.documentElement);
 const pos=cs.getPropertyValue('--pos').trim(),neg=cs.getPropertyValue('--neg').trim(),
       ink=cs.getPropertyValue('--ink').trim(),mut=cs.getPropertyValue('--mut').trim(),
       line=cs.getPropertyValue('--line').trim();
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
 const padL=58,padR=8,padT=12,padB=26,pw=W-padL-padR,ph=H-padT-padB;
 const max=Math.max(1,Math.max.apply(null,S.map(s=>Math.max(s.inc,s.exp))))*1.15;
 const y=v=>padT+ph-(v/max)*ph;
 ctx.font='10px ui-monospace,Consolas,monospace';ctx.fillStyle=mut;ctx.textAlign='right';ctx.textBaseline='middle';
 for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);
  ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
  ctx.fillText(shortMoney(v),padL-8,yy);}
 const gw=pw/S.length,bw=Math.min(16,gw*0.26);
 function bar(x,y0,h,color){h=Math.max(h,.5);ctx.fillStyle=color;ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y0,bw,h,[3,3,0,0]);else ctx.rect(x,y0,bw,h);ctx.fill();}
 ctx.textAlign='center';ctx.textBaseline='alphabetic';
 S.forEach((s,i)=>{const cx=padL+gw*i+gw/2;
  bar(cx-bw-3,y(s.inc),padT+ph-y(s.inc),pos);
  bar(cx+3,y(s.exp),padT+ph-y(s.exp),neg);
  ctx.fillStyle=mut;ctx.fillText(s.label,cx,H-8);});
 ctx.strokeStyle=ink;ctx.setLineDash([5,4]);ctx.lineWidth=1.5;ctx.beginPath();
 S.forEach((s,i)=>{const cx=padL+gw*i+gw/2,yy=y(Math.max(0,s.net));if(i)ctx.lineTo(cx,yy);else ctx.moveTo(cx,yy);});
 ctx.stroke();ctx.setLineDash([]);
 S.forEach((s,i)=>{const cx=padL+gw*i+gw/2,yy=y(Math.max(0,s.net));
  ctx.fillStyle=ink;ctx.beginPath();ctx.arc(cx,yy,2.5,0,7);ctx.fill();});}

function statRange(){
 if(ui.statPeriod==='bulan'){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1);}
 if(ui.statPeriod==='6bulan'){const now=new Date();return iso(new Date(now.getFullYear(),now.getMonth()-5,1));}
 return null;}
function inPeriod(dateStr,from){
 if(!from)return true;
 if(from.length===7)return dateStr.indexOf(from)===0;
 return dateStr>=from;}
function statData(){
 const from=statRange();
 const exp=db.transactions.filter(t=>t.type==='expense'&&inPeriod(t.occurred_at,from));
 const inc=db.transactions.filter(t=>t.type==='income'&&inPeriod(t.occurred_at,from));
 const map={};let total=0;
 exp.forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;total+=t.amount;});
 const list=Object.keys(map).map(c=>({cat:c,val:map[c]})).sort((a,b)=>b.val-a.val);
 list.forEach(x=>x.pct=total?Math.round(x.val/total*100):0);
 let days;const now=new Date();
 if(ui.statPeriod==='bulan')days=now.getDate();
 else if(ui.statPeriod==='6bulan')days=Math.max(1,Math.round((now-parseISO(iso(new Date(now.getFullYear(),now.getMonth()-5,1))))/864e5)+1);
 else{const first=db.transactions.reduce((m,t)=>t.occurred_at<m?t.occurred_at:m,todayISO());
  days=Math.max(1,Math.round((now-parseISO(first))/864e5)+1);}
 const incT=inc.reduce((s,t)=>s+t.amount,0);
 return {list:list,total:total,count:exp.length,avg:days?total/days:0,inc:incT,
  sr:incT>0?Math.round((incT-total)/incT*100):null,
  biggest:exp.slice().sort((a,b)=>b.amount-a.amount).slice(0,5)};}

function drawDonut(){
 const cv=$('#donut');if(!cv||!cv.clientWidth)return;
 const D=statData().list;
 const cs=getComputedStyle(document.documentElement);
 const ink=cs.getPropertyValue('--ink').trim(),mut=cs.getPropertyValue('--mut').trim(),
       line=cs.getPropertyValue('--line').trim();
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
 const cx=W/2,cy=H/2,R=Math.min(cy-14,92),th=R*0.44;
 if(!D.length){ctx.fillStyle=mut;ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText('Belum ada pengeluaran',cx,cy);return;}
 const total=D.reduce((s,x)=>s+x.val,0);
 let a=-Math.PI/2;
 D.forEach(x=>{const ang=x.val/total*Math.PI*2;
  ctx.beginPath();ctx.arc(cx,cy,R,a+0.02,Math.max(a+0.03,a+ang-0.02));
  ctx.strokeStyle=catDot(x.cat);ctx.lineWidth=th;ctx.lineCap='butt';ctx.stroke();
  a+=ang;});
 ctx.beginPath();ctx.arc(cx,cy,R+th/2+1,0,7);ctx.strokeStyle=line;ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle=ink;ctx.font='700 17px ui-monospace,Consolas,monospace';ctx.textAlign='center';
 ctx.fillText(shortMoney(total),cx,cy-2);
 ctx.fillStyle=mut;ctx.font='8px ui-monospace,Consolas,monospace';
 ctx.fillText('PENGELUARAN',cx,cy+14);}

function reportData(){
 const ym=ui.reportMonth;
 const txns=db.transactions.filter(t=>!ym||t.occurred_at.indexOf(ym)===0)
  .sort((a,b)=>b.occurred_at.localeCompare(a.occurred_at));
 const debts=db.debts.filter(d=>!ym||(d.due_date||'').indexOf(ym)===0)
  .sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));
 let inc=0,exp=0;txns.forEach(t=>{if(t.type==='income')inc+=t.amount;else exp+=t.amount;});
 return {txns:txns,debts:debts,inc:inc,exp:exp,net:inc-exp,ym:ym};}

function afterPengaturan(){
 $('#p-save').onclick=()=>{
  const v=$('#p-name').value.trim();
  if(!v){toast('Nama tidak boleh kosong.','error');return;}
  db.profile.name=v;save();updateProfileUI();toast('Nama diperbarui.');};
 const gp=$('#go-plan');if(gp)gp.onclick=()=>{location.hash='#/langganan';};
 $('#theme-set').addEventListener('click',e=>{
  const b=e.target.closest('button[data-th]');if(!b)return;
  const want=b.getAttribute('data-th')==='dark';
  if(want!==document.documentElement.classList.contains('dark'))toggleTheme();});
 /* dompet */
 $('#w-form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#w-name').value.trim();
  if(!name){toast('Isi nama dompet.','error');return;}
  if(atLimit('wallets')){showUpgrade('wallets','Paket '+planName()+' cuma bisa '+planLimit('wallets')+' dompet. Upgrade untuk unlimited.');return;}
  const init=parseAmt($('#w-init').value);
  db.wallets.push({id:uid(),name:name,color:$('#w-color').value,initial:init});
  save();toast('Dompet "'+esc(name)+'" ditambahkan.');render();});
 /* budget */
 $('#bud-save').onclick=()=>{
  $$('.budin').forEach(inp=>{
   const cat=inp.getAttribute('data-cat');
   const v=parseAmt(inp.value);
   if(v>0)db.budgets[cat]=v;else delete db.budgets[cat];});
  save();toast('Budget disimpan.');render();};
 /* kategori kustom */
 $('#c-form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#c-name').value.trim();
  if(!name){toast('Isi nama kategori.','error');return;}
  if(CAT_COLOR[name]||db.customCats.some(c=>c.name===name)){toast('Nama kategori sudah dipakai.','error');return;}
  if(atLimit('customCats')){showUpgrade('customCats','Paket '+planName()+' cuma bisa '+planLimit('customCats')+' kategori kustom. Upgrade untuk unlimited.');return;}
  const kw=$('#c-kw').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  db.customCats.push({name:name,type:$('#c-type').value,color:$('#c-color').value,kw:kw});
  applyCustomCats();save();toast('Kategori "'+esc(name)+'" ditambahkan.');render();});
 /* PIN */
 const hashPin=p=>{let h=5381;for(let i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))>>>0;return 'h'+h.toString(16);};
 const pinOn=$('#pin-on');
 if(pinOn)pinOn.onclick=()=>{
  const p=$('#pin-new').value;
  if(!/^\d{4,8}$/.test(p)){toast('PIN harus 4–8 angka.','error');return;}
  db.profile.pin=hashPin(p);db.profile.pinEnabled=true;save();
  toast('PIN aktif — aplikasi akan terkunci saat dibuka.');render();};
 const pinOff=$('#pin-off');
 if(pinOff)pinOff.onclick=()=>confirmModal('Matikan PIN?','Aplikasi tidak akan terkunci lagi saat dibuka.',
  ()=>{db.profile.pinEnabled=false;db.profile.pin=null;save();toast('PIN dimatikan.','info');render();},true);
 const pinCh=$('#pin-change');
 if(pinCh)pinCh.onclick=()=>confirmModal('Ganti PIN?','PIN lama akan dihapus — kamu akan diminta PIN baru setelahnya (fitur sederhana: ganti = matikan lalu aktifkan lagi).',
  ()=>{db.profile.pinEnabled=false;db.profile.pin=null;save();render();
   setTimeout(()=>toast('PIN dimatikan. Aktifkan PIN baru di bagian ini.','info'),300);},false);
 /* data */
 $('#exp-btn').onclick=exportJSON;
 $('#csv-btn2').onclick=exportCSV;
 $('#imp-btn').onclick=()=>$('#imp-file').click();
 $('#imp-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
   try{
    const j=JSON.parse(rd.result);
    if(!j||!Array.isArray(j.transactions)||!Array.isArray(j.debts))throw 0;
    confirmModal('Impor data?','Data saat ini akan DIGANTI dengan isi '+esc(f.name)+
     ' ('+j.transactions.length+' transaksi, '+j.debts.length+' entri utang/piutang).',()=>{
      db=j.version===3?j:migrateOld(j);
      applyCustomCats();save();updateProfileUI();render();toast('Data berhasil diimpor.');},true);
   }catch(err){toast('File tidak valid — gunakan backup JSON dari aplikasi ini.','error');}
  };
  rd.readAsText(f);e.target.value='';});
 $('#reset-btn').onclick=()=>confirmModal('Reset semua data?',
  'Seluruh transaksi & utang/piutang dihapus lalu diisi ulang data contoh.',()=>{
   db=seed();applyCustomCats();save();render();toast('Data contoh dimuat ulang.','info');},true);
 $('#wipe-btn').onclick=()=>confirmModal('Hapus SEMUA data?',
  'Semua transaksi dan utang/piutang dihapus permanen dari browser ini.',()=>{
   const keep={profile:db.profile,settings:db.settings};
   db=Object.assign(defaultDb(),keep,{demo:false,settings:Object.assign({},db.settings,{onboarded:true})});
   save();render();toast('Semua data dihapus.','info');},true);
 /* Cloud backup/restore — R2 disabled, no handlers needed */}
function exportJSON(){
 db.settings.lastBackup=todayISO();save();
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='arus-backup-'+todayISO()+'.json';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast('Backup JSON diunduh — simpan di tempat aman.');}
function exportCSV(){
 const rows=[['Tanggal','Jenis','Kategori','Deskripsi','Jumlah','Dompet','Sumber']];
 const all=db.transactions.slice().sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at));
 all.forEach(t=>rows.push([t.occurred_at,t.type==='income'?'Masuk':'Keluar',t.category,
  '"'+String(t.description).replace(/"/g,'""')+'"',t.amount,walletName(t.wallet_id),t.source||'manual']));
 const csv='\ufeff'+rows.map(r=>r.join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='arus-transaksi-'+todayISO()+'.csv';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 toast('CSV diunduh ('+all.length+' baris).');}

/* ══════ PDF (jsPDF + fallback cetak) ══════ */
const PDF={ink:[45,42,36],paper:[244,241,232],mut:[150,144,128],hdr:[30,27,21],boxBg:[247,245,238],boxLine:[224,219,206],boxMut:[130,124,108]};
function pdfBase(){return {theme:'grid',
 styles:{font:'helvetica',fontSize:8.5,cellPadding:{top:5,bottom:5,left:6,right:6},lineColor:PDF.boxLine,lineWidth:.5,textColor:PDF.ink},
 headStyles:{fillColor:PDF.hdr,textColor:PDF.paper,fontSize:8,lineWidth:0},
 alternateRowStyles:{fillColor:PDF.boxBg},
 margin:{left:48,right:48,top:46,bottom:56}};}
function pdfHead(doc,title,sub,rightBold,rightMut){
 const W=doc.internal.pageSize.getWidth();
 doc.setFillColor(PDF.hdr[0],PDF.hdr[1],PDF.hdr[2]);doc.rect(0,0,W,88,'F');
 doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(PDF.paper[0],PDF.paper[1],PDF.paper[2]);doc.text(title,48,36);
 doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(sub,48,58);
 doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(rightBold,W-48,36,{align:'right'});
 doc.setFont('helvetica','normal');doc.setTextColor(168,162,146);doc.text(rightMut,W-48,58,{align:'right'});}
function pdfBoxes(doc,items){
 const W=doc.internal.pageSize.getWidth(),M=48,n=items.length;
 const bw=(W-2*M-(n-1)*10)/n;
 items.forEach((it,i)=>{const x=M+i*(bw+10);
  doc.setFillColor(PDF.boxBg[0],PDF.boxBg[1],PDF.boxBg[2]);doc.setDrawColor(PDF.boxLine[0],PDF.boxLine[1],PDF.boxLine[2]);
  doc.setLineWidth(.6);doc.roundedRect(x,104,bw,56,6,6,'FD');
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(PDF.boxMut[0],PDF.boxMut[1],PDF.boxMut[2]);
  doc.text(it[0].toUpperCase(),x+9,122);
  doc.setFontSize(String(it[1]).length>14?9.5:11.5);doc.setTextColor(it[2][0],it[2][1],it[2][2]);
  doc.text(String(it[1]),x+9,146);});}
function pdfFooter(doc,period){
 const H=doc.internal.pageSize.getHeight(),W=doc.internal.pageSize.getWidth();
 const n=doc.getNumberOfPages();
 for(let i=1;i<=n;i++){doc.setPage(i);
  doc.setDrawColor(PDF.boxLine[0],PDF.boxLine[1],PDF.boxLine[2]);doc.setLineWidth(.5);doc.line(48,H-44,W-48,H-44);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(PDF.mut[0],PDF.mut[1],PDF.mut[2]);
  doc.text('Arus — pencatatan keuangan pribadi · '+period,48,H-30);
  doc.text('Halaman '+i+' dari '+n,W-48,H-30,{align:'right'});}}
function pdfContHead(period){
 return data=>{const d=data.doc||data;if(d.internal.getCurrentPageInfo().pageNumber>1){
  d.setFont('helvetica','bold');d.setFontSize(8);d.setTextColor(PDF.ink[0],PDF.ink[1],PDF.ink[2]);
  d.text('Arus — '+period+' (lanjutan)',48,28);}};}
function printFallback(title,html){
 const w=window.open('','_blank');
 if(!w){toast('Popup diblokir. Izinkan popup untuk mencetak.','error');return;}
 w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+
  'body{font-family:Arial,sans-serif;color:#1d1b16;padding:26px;font-size:12px}'+
  'h1{font-size:17px;margin:0 0 2px}h2{font-size:14px;margin:18px 0 6px}'+
  '.mut{color:#777;font-size:11px}table{width:100%;border-collapse:collapse;margin:8px 0 14px}'+
  'th,td{border:1px solid #d8d3c4;padding:6px 8px;text-align:left}th{background:#efece2;font-size:10px;text-transform:uppercase}'+
  '.r{text-align:right}.tot td{font-weight:bold;background:#f7f5ee}'+
  '.boxes{display:flex;gap:8px;margin:12px 0}.box{flex:1;border:1px solid #d8d3c4;border-radius:6px;padding:8px 10px}'+
  '.box b{display:block;font-size:9px;color:#777;text-transform:uppercase}.box span{font-size:13px;font-weight:bold}'+
  '@media print{body{padding:10px}}</style></head><body>'+html+
  '<'+'script>window.onload=function(){setTimeout(function(){window.print()},250)}<'+'/script></body></html>');
 w.document.close();}

/* ══════ PIN lock ══════ */
function hashPin(p){let h=5381;for(let i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))>>>0;return 'h'+h.toString(16);}
function showPinLock(){
 const lk=$('#pinlock');
 lk.style.display='flex';
 lk.innerHTML='<div class="panel" style="max-width:320px;text-align:center">'+
  '<div style="display:inline-flex;color:var(--mut);margin-bottom:8px">'+ic('lock','w20')+'</div>'+
  '<h3 style="font-weight:800;font-size:16px">Arus terkunci</h3>'+
  '<p class="xs muted" style="margin-top:4px">Masukkan PIN untuk melanjutkan</p>'+
  '<input id="pin-in" class="fld mono" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:20px;letter-spacing:.4em;margin-top:14px" aria-label="PIN">'+
  '<button class="btn primary" id="pin-ok" style="width:100%;margin-top:12px">Buka</button>'+
  '<div class="xs muted" style="margin-top:10px">Lupa PIN? Hapus data browser (localStorage "arus-data-v3") — atau pulihkan dari backup.</div></div>';
 const check=()=>{
  if($('#pin-in').value.length>=4&&hashPin($('#pin-in').value)===db.profile.pin){
   lk.style.display='none';lk.innerHTML='';}
  else{lk.classList.add('shake');$('#pin-in').value='';
   setTimeout(()=>lk.classList.remove('shake'),420);}};
 $('#pin-ok').onclick=check;
 $('#pin-in').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
 setTimeout(()=>$('#pin-in').focus(),60);}

 const ab=$('#admin-btn');
 if(ab)ab.style.display=isAdmin()?'inline-flex':'none';
}
function applyThemeUI(){
 const dk=document.documentElement.classList.contains('dark');
 $('#theme-ic').innerHTML=ic(dk?'sun':'moon');
 $('#theme-ic2').innerHTML=ic(dk?'sun':'moon');
 $('#theme-lbl').textContent=dk?'Mode terang':'Mode gelap';}
function toggleTheme(){
 document.documentElement.classList.toggle('dark');
 try{localStorage.setItem('arus-theme',document.documentElement.classList.contains('dark')?'dark':'light');}catch(e){}
 applyThemeUI();render();}

/* ══════ Forgot Password ══════ */
function openForgotModal(){
 openModal('<div style="text-align:center;padding:24px">'+
  '<div style="font-size:28px;margin-bottom:4px">🔑</div>'+
  '<h3 style="margin:0 0 8px;color:var(--ink)">Reset Password</h3>'+
  '<p class="muted" style="margin-bottom:16px;font-size:13px">Masukkan email untuk link reset password.</p>'+
  '<input id="forgot-email" type="email" placeholder="Email" style="width:100%;padding:10px;margin-bottom:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:13px">'+
  '<button onclick="doForgotPassword()" class="btn primary" style="width:100%;padding:12px;border-radius:8px;font-size:15px">Kirim Link Reset</button>'+
  '</div>');
}
async function doForgotPassword(){
 const email=document.getElementById('forgot-email')?.value;
 if(!email){toast('Masukkan email');return;}
 const r=await api('/auth/forgot-password',{method:'POST',body:JSON.stringify({email})});
 closeModal();
 if(r.ok)toast('Cek email untuk link reset password 📧','info');
 else toast(r.error||'Gagal');
}

/* ══════ Admin Panel ══════ */
function isAdmin(){return currentUser&&currentUser.email==='riskiakbarp123@gmail.com';}

function openAdmin(){
 if(!isAdmin()){toast('Hanya admin yang bisa akses');return;}
 let p=document.getElementById('admin-panel');
 if(!p){
  p=document.createElement('div');
  p.id='admin-panel';
  p.style.cssText='display:none;position:fixed;top:0;right:0;width:min(420px,90vw);height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:9999;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.15)';
  p.innerHTML=
   '<div style="padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px">'+
   '<span style="font-size:18px">🛡️</span>'+
   '<span style="font-weight:700;flex:1">Admin Panel</span>'+
   '<button onclick="closeAdmin()" style="border:none;background:var(--soft);color:var(--ink);font-size:16px;cursor:pointer;border-radius:8px;padding:4px 10px">✕</button></div>'+
   '<div style="padding:12px;display:flex;gap:6px;border-bottom:1px solid var(--line)">'+
   '<button class="admin-tab active" data-atab="dashboard">Dashboard</button>'+
   '<button class="admin-tab" data-atab="users">Users</button>'+
   '<button class="admin-tab" data-atab="txns">Transaksi</button></div>'+
   '<div id="admin-content" style="padding:16px"></div>';
  document.body.appendChild(p);
  p.querySelectorAll('.admin-tab').forEach(b=>b.onclick=()=>loadAdminTab(b.dataset.atab));
 }
 p.style.display='block';
 loadAdminTab('dashboard');
}
function closeAdmin(){const p=document.getElementById('admin-panel');if(p)p.style.display='none';}

function loadAdminTab(tab){
 document.querySelectorAll('.admin-tab').forEach(b=>{b.classList.toggle('active',b.dataset.atab===tab);});
 const c=document.getElementById('admin-content');
 if(!c)return;
 c.innerHTML='<div style="text-align:center;padding:32px;color:var(--mut)">Memuat...</div>';
 if(tab==='dashboard')loadAdminDashboard(c);
 else if(tab==='users')loadAdminUsers(c);
 else if(tab==='txns')loadAdminTransactions(c);
}

async function loadAdminDashboard(c){
 const r=await api('/admin/stats');
 if(r.error){c.innerHTML='<div class="muted">Error: '+esc(r.error)+'</div>';return;}
 const d=r.data||{};
 c.innerHTML=
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">'+
  statBox('👥','Total User',d.totalUsers||0)+
  statBox('⭐','Pro',d.proCount||0)+
  statBox('💰','Revenue',(d.monthlyRevenue||0).toLocaleString('id-ID'))+
  statBox('🆕','7d Signup',d.recentSignups||0)+
  '</div>'+
  '<div class="xs muted">Active Pro: '+(d.activePro||0)+' · Expired: '+(d.expiredPro||0)+'</div>';
}

function statBox(icon,label,value){
 return '<div style="padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)">'+
  '<div class="xs muted">'+icon+' '+label+'</div>'+
  '<div style="font-size:18px;font-weight:700;margin-top:4px">'+value+'</div></div>';
}

async function loadAdminUsers(c){
 const r=await api('/admin/users');
 if(r.error){c.innerHTML='<div class="muted">Error: '+esc(r.error)+'</div>';return;}
 const users=r.data||[];
 c.innerHTML=
  '<input id="admin-user-search" placeholder="Cari nama/email..." style="width:100%;padding:8px 10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:13px">'+
  '<div style="font-size:11px;color:var(--mut);margin-bottom:8px">'+users.length+' user terdaftar</div>'+
  '<div id="admin-user-list" style="display:flex;flex-direction:column;gap:8px">'+
  users.map(u=>adminUserCard(u)).join('')+'</div>';
 document.getElementById('admin-user-search')?.addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.admin-user-card').forEach(el=>{
   el.style.display=el.dataset.search.includes(q)?'block':'none';
  });
 });
}

function adminUserCard(u){
 const isPro=u.plan==='pro';
 const s=u.name+' '+u.email+' '+u.user_id;
 return '<div class="admin-user-card" data-search="'+esc(s.toLowerCase())+'" style="padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)">'+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
  '<div style="width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--invfg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">'+esc((u.name||'?')[0].toUpperCase())+'</div>'+
  '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(u.name)+'</div><div class="xs muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(u.email)+'</div></div>'+
  '<span class="badge '+(isPro?'b-paid':'b-unpaid')+'" style="font-size:10px;padding:2px 8px;border-radius:4px">'+(isPro?'PRO':'Free')+'</span>'+
  '</div>'+
  '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
  '<button class="btn mini" onclick="adminTogglePlan(\''+esc(u.user_id)+'\',\''+esc(u.plan)+'\')" style="font-size:10px">'+(isPro?'↓ Free':'↑ Pro')+'</button>'+
  '<button class="btn mini" onclick="adminResetPw(\''+esc(u.user_id)+'\')" style="font-size:10px">Reset PW</button>'+
  '<button class="btn mini danger" onclick="adminDeleteUser(\''+esc(u.user_id)+'\',\''+esc(u.name)+'\')" style="font-size:10px">Hapus</button>'+
  '</div></div>';
}

async function adminTogglePlan(uid,currentPlan){
 const newPlan=currentPlan==='pro'?'free':'pro';
 const r=await api('/admin/subscription/update',{method:'POST',body:JSON.stringify({user_id:uid,plan:newPlan})});
 if(r.data)toast('Plan diubah ke '+newPlan);
 else toast(r.error||'Gagal','error');
 loadAdminTab('users');
}

async function adminResetPw(uid){
 const r=await api('/admin/user/reset-password',{method:'POST',body:JSON.stringify({user_id:uid})});
 toast(r.ok?r.message:(r.error||'Gagal'),r.ok?'info':'error');
}

async function adminDeleteUser(uid,name){
 if(!confirm('Hapus user "'+name+'" permanen? Semua data akan hilang.'))return;
 const r=await api('/admin/user',{method:'DELETE',body:JSON.stringify({user_id:uid})});
 if(r.ok)toast('User dihapus');
 else toast(r.error||'Gagal','error');
 loadAdminTab('users');
}

async function loadAdminTransactions(c){
 const r=await api('/admin/transactions?limit=30');
 if(r.error){c.innerHTML='<div class="muted">Error: '+esc(r.error)+'</div>';return;}
 const txns=r.data||[];
 if(!txns.length){c.innerHTML='<div class="muted" style="padding:20px;text-align:center">Belum ada transaksi</div>';return;}
 c.innerHTML=txns.map(t=>
  '<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12px">'+
  '<div style="display:flex;justify-content:space-between"><span style="font-weight:600">'+esc(t.category||t.description||'-')+'</span><span class="mono" style="color:'+(t.type==='income'?'var(--pos)':'var(--neg)')+'">'+(t.type==='income'?'+':'-')+money(t.amount)+'</span></div>'+
  '<div class="xs muted">'+esc(t.user_email||t.user_id?.slice(0,8)||'')+' · '+fmtDate(t.occurred_at)+'</div></div>'
 ).join('');
}

/* ══════ Onboarding Dashboard ══════ */

 openModal(
  '<div style="text-align:center;padding:20px">'+
  '<div style="font-size:48px;margin-bottom:12px">👋</div>'+
  '<h3 style="margin:0 0 8px;color:var(--ink)">Selamat datang, '+esc(name)+'!</h3>'+
  '<p class="muted" style="margin-bottom:20px;font-size:13px">Ayo siapkan buku kas kamu dalam 3 langkah.</p>'+
  '<div id="ob-steps">'+
  '<div class="ob-step" style="margin-bottom:16px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:left">'+
  '<div style="font-weight:700;font-size:13px;margin-bottom:6px">1️⃣  Dompet Utama</div>'+
  '<input id="ob-wallet" value="'+esc(db.wallets[0]?.name||'Dompet Utama')+'" placeholder="Nama dompet" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:13px">'+
  '<div class="xs muted" style="margin-top:4px">Tempat kamu catat semua pemasukan & pengeluaran.</div>'+
  '</div>'+
  '<div class="ob-step" style="margin-bottom:16px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:left">'+

  '<div class="xs muted" style="margin-top:4px">Isi saldo dompet sekarang (boleh 0).</div>'+
  '</div>'+
  '<div class="ob-step" style="margin-bottom:16px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:left">'+
  '<div style="font-weight:700;font-size:13px;margin-bottom:6px">3️⃣  Mulai Catat! 🎉</div>'+
  '<div class="muted" style="font-size:13px">Ketik transaksi pertama kamu di halaman utama. Arus akan otomatis kategorikan dari deskripsi — coba ketik "makan bakso 15rb" 😉</div>'+
  '</div>'+
  '</div>'+
  '<button onclick="finishOnboarding()" class="btn primary" style="width:100%;padding:12px;border-radius:8px;font-size:15px;margin-top:4px">Mulai! 🚀</button>'+
  '</div>'
 );
}

function finishOnboarding(){
 const wName=document.getElementById('ob-wallet')?.value||'Dompet Utama';
 const bal=parseAmt(document.getElementById('ob-balance')?.value||'0');
 if(db.wallets.length>0){db.wallets[0].name=wName;db.wallets[0].initial=bal;}
 else{db.wallets.push({id:uid(),name:wName,color:'#C9A962',initial:bal});}
 db.settings.onboarded=true;
 save();closeModal();render();
 toast('Selamat mencatat! 🎉');
}

/* Init */
load();
applyCustomCats();
processRecurring();
applyThemeUI();
updateProfileUI();
if(db.profile.pinEnabled&&db.profile.pin)showPinLock();
render();

// Auto-restore session if token exists
(async function(){
 if(!authToken||!currentUser)return;
 try{
  const me=await api('/auth/me');
  if(me.data&&me.data.email){
   currentUser={id:me.data.id,email:me.data.email,name:me.data.user_metadata?.name||'Saya'};
   localStorage.setItem('arus-current-user',JSON.stringify(currentUser));
   // Sync subscription
   const sub=await api('/subscription?user_id='+currentUser.id);
   if(sub.data){db.subscription={plan:sub.data.plan,startedAt:sub.data.started_at,expiresAt:sub.data.expires_at};save();}
   // Pull cloud data if Pro — disabled (R2 not bound)
   // if(getPlan().id==='pro'){await syncFromCloud();render();}
   updateProfileUI();
  }else{
   // Token expired — clear
   authToken=null;currentUser=null;
   localStorage.removeItem('arus-auth-token');
   localStorage.removeItem('arus-current-user');
   updateProfileUI();
  }
 }catch(e){}
})();

if(!db.settings.onboarded)setTimeout(onboardModal,db.profile.pinEnabled?900:400);
window.addEventListener('hashchange',render);
window.addEventListener('resize',()=>{if(ui.route==='dashboard')drawChart();if(ui.route==='statistik')drawDonut();});
 $('#menu-btn').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('show');};
 $('#scrim').onclick=closeNav;
 $('#theme-top').onclick=toggleTheme;
 $('#theme-row').onclick=toggleTheme;
 $('#add-btn').onclick=goAdd;
 $('#bell-btn').onclick=bellModal;
 $('#plan-badge-top').onclick=()=>{location.hash='#/langganan';};
 $('#profile-btn').onclick=()=>{
 openModal('<h3 style="font-weight:800;font-size:16px">Nama tampilan</h3>'+
  '<label class="lbl" style="margin-top:14px">Nama</label>'+
  '<input id="p-name" class="fld" value="'+esc(db.profile.name||'')+'" maxlength="40">'+
  '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:18px">'+
  '<button class="btn" data-close>Batal</button><button class="btn primary" id="p-ok">Simpan</button></div>');
 $('#p-ok').onclick=()=>{const v=$('#p-name').value.trim();
  if(!v){toast('Nama tidak boleh kosong.','error');return;}
  db.profile.name=v;save();updateProfileUI();
  closeModal();toast('Nama diperbarui.');render();};};
/* Delegasi klik global */
document.addEventListener('click',e=>{
 if(e.target.closest('.navlink'))closeNav();
 const cl=e.target.closest('[data-close]');if(cl){closeModal();return;}
 const bk=e.target.closest('[data-backup]');if(bk){exportJSON();return;}
 const bo=e.target.closest('[data-backupok]');
 if(bo){db.settings.lastBackup=todayISO();save();render();toast('Oke — diingat 14 hari lagi.','info');return;}
 const st=e.target.closest('[data-settle]');if(st){settleModal(st.getAttribute('data-settle'));return;}
 const hs=e.target.closest('[data-history]');if(hs){historyModal(hs.getAttribute('data-history'));return;}
 const pp=e.target.closest('[data-personpdf]');if(pp){exportPersonPDF(pp.getAttribute('data-personpdf'));return;}
 const et=e.target.closest('[data-edittxn]');if(et){editTxnModal(et.getAttribute('data-edittxn'));return;}
 const ed=e.target.closest('[data-editdebt]');if(ed){editDebtModal(ed.getAttribute('data-editdebt'));return;}
 const dw=e.target.closest('[data-delwallet]');
 if(dw){confirmModal('Hapus dompet?','Transaksi di dalamnya dipindahkan ke dompet pertama.',()=>{
  const wid=dw.getAttribute('data-delwallet');
  const w=db.wallets.find(x=>x.id===wid);
  const target=db.wallets.filter(x=>x.id!==wid)[0];
  db.transactions.forEach(t=>{if(t.wallet_id===wid)t.wallet_id=target.id;});
  db.wallets=db.wallets.filter(x=>x.id!==wid);
  save();toast('Dompet "'+esc(w?w.name:'')+'" dihapus, transaksi dipindah.');render();},true);return;}
 const dc2=e.target.closest('[data-delcat]');
 if(dc2){db.customCats.splice(+dc2.getAttribute('data-delcat'),1);applyCustomCats();save();toast('Kategori kustom dihapus.','info');render();return;}
 const dt=e.target.closest('[data-deltxn]');
 if(dt){confirmModal('Hapus transaksi?','Bisa dipulihkan lewat tombol "Urungkan" setelah ini.',
  ()=>{deleteTransaction(dt.getAttribute('data-deltxn'));
   toast('Transaksi dihapus.','info',{label:'↩ Urungkan',fn:doUndo});render();},true);return;}
 const dd=e.target.closest('[data-deldebt]');
 if(dd){confirmModal('Hapus entri ini?','Bisa dipulihkan lewat tombol "Urungkan" setelah ini.',
  ()=>{deleteDebt(dd.getAttribute('data-deldebt'));
   toast('Entri dihapus.','info',{label:'↩ Urungkan',fn:doUndo});render();},true);return;}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return;}
 if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key==='n'){e.preventDefault();goAdd();}});
</script>
