name = "arus-kas"
main = "worker/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Build: kumpulkan aset statis dari public/ ke out/ (arsitektur pure Workers:
# worker/index.ts menangani /api/*, out/ hanya berisi file statis).
# TIDAK menjalankan next build — output:export bentrok dengan route API force-dynamic.
[build]
command = "mkdir -p out && cp -r public/. out/ && printf '<!DOCTYPE html><html lang=\"id\"><head><meta charset=\"utf-8\"><meta http-equiv=\"refresh\" content=\"0;url=/arus.html\"><title>Arus</title></head><body>Membuka aplikasi Arus...</body></html>' > out/index.html"

# Static assets (landing page + arus.html + admin.html + _next/static)
[assets]
directory = "./out"
binding = "ASSETS"

[vars]
SUPABASE_URL = "https://evntvbqrprizgqogjyva.supabase.co"
# Publishable key (anon baru) — memang dirancang publik, aman di-commit.
# Key JWT lama sudah dicabut Supabase karena bocor; worker mem-prioritaskan key ini.
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vvSBUy-g0ZlCSRDqM1_H4A_Qt6OUPpo"
MIDTRANS_IS_PRODUCTION = "false"
ADMIN_EMAIL = "riskiakbarp123@gmail.com"

# ── KV Namespace (rate limiting, session cache, feature flags) ──
[[kv_namespaces]]
binding = "arus_kv"
id = "b16a988d730c4dddb15621fa3a8f492f"

# ── Cron Triggers ──
[triggers]
crons = ["0 2 * * *"]

# ── Routes (deploy target) ──
routes = [
  { pattern = "arus-kas.riskiakbarp123-a03.workers.dev", custom_domain = true }
]

# ── Secrets (set via: npx wrangler secret put NAME) ──
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_KEY
# MIDTRANS_SERVER_KEY
# RESEND_API_KEY
